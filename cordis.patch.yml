# dsa-zotero-sidebar bundle patch
#
# This file is the `dsh.bundle.patch` layer of the published npm package: when
# the plugin is installed through the official CLI —
#
#   dsh plugin --profile <name> add dsa-zotero-sidebar@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages
# and, seeing this declaration, appends `dsa-zotero-sidebar` to the bundle
# stack. The profile boot then merges THIS patch (a single `insert` of the
# plugin row) like the manual cordis.patch.yml mount line used before. No
# profile file edits needed — one command installs and mounts.
- insert:
    - id: zotero-sidebar
      name: 'dsa-zotero-sidebar'
